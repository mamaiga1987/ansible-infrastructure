---
- name: Fix IP PostgreSQL — TOUS les projets Python
  hosts: localhost

  tasks:
    - name: "1. Récupérer l'IP actuelle de PostgreSQL"
      tags: [postgres, ip, reboot]
      command: docker inspect debian-postgres-1 --format "{% raw %}{{.NetworkSettings.Networks.web.IPAddress}}{% endraw %}"
      register: pg_ip

    - name: "2. Afficher l'IP trouvée"
      debug:
        msg: "IP PostgreSQL actuelle : {{ pg_ip.stdout }}"

    - name: "3. Chercher tous les fichiers Python dans /opt/"
      tags: [postgres, ip, reboot]
      find:
        paths: /opt
        patterns: "*.py"
        recurse: yes
      register: fichiers_python

    - name: "4. Corriger l'IP dans TOUS les fichiers Python"
      tags: [postgres, ip, correction]
      replace:
        path: "{{ item.path }}"
        regexp: '172\.19\.0\.\d+'
        replace: "{{ pg_ip.stdout }}"
      loop: "{{ fichiers_python.files }}"
      ignore_errors: yes

    - name: "5. Chercher tous les docker-compose.yml"
      find:
        paths: /opt
        patterns: "docker-compose.yml"
        recurse: yes
        depth: 2
      register: compose_files

    - name: "6. Restart tous les conteneurs"
      tags: [docker, restart, reboot]
      command: docker compose -f {{ item.path }} restart
      loop: "{{ compose_files.files }}"
      ignore_errors: yes

    - name: "7. Résumé"
      debug:
        msg: |
          IP PostgreSQL : {{ pg_ip.stdout }}
          Fichiers Python corrigés : {{ fichiers_python.files | length }}
          Projets redémarrés : {{ compose_files.files | length }}

    - name: "8. Connecter jobassistant-backend au réseau n8n"
      tags: [jobassistant, network, reboot]
      shell: docker network connect debian_default jobassistant-backend 2>/dev/null || true

    - name: "9. Connecter jobassistant-backend au réseau bi-stack"
      tags: [jobassistant, network, reboot]
      shell: docker network connect bi-stack_analytics-net jobassistant-backend 2>/dev/null || true

    - name: "10. Vérifier santé JobAssistant backend"
      tags: [jobassistant, health]
      shell: docker exec jobassistant-backend wget -qO- http://localhost:4003/api/health
      register: ja_health
      ignore_errors: yes

    - name: "11. Afficher statut JobAssistant"
      debug:
        msg: "JobAssistant backend: {{ ja_health.stdout | default('Non disponible') }}"
