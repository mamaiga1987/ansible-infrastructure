---
- name: Fix IP PostgreSQL — TOUS les projets Python
  hosts: localhost

  tasks:
    - name: "1. Récupérer l'IP actuelle de PostgreSQL"
      tags: [postgres, ip, reboot]
      command: docker inspect debian-postgres-1 --format "{% raw %}{{.NetworkSettings.Networks.web.IPAddress}}{% endraw %}"
      register: pg_ip

    - name: "2. Afficher l'IP trouvée"
      debug:
        msg: "IP PostgreSQL actuelle : {{ pg_ip.stdout }}"

    - name: "3. Chercher tous les fichiers Python dans /opt/"
      tags: [postgres, ip, reboot]
      find:
        paths: /opt
        patterns: "*.py"
        recurse: yes
      register: fichiers_python

    - name: "4. Corriger l'IP dans TOUS les fichiers Python"
      tags: [postgres, ip, correction]
      replace:
        path: "{{ item.path }}"
        regexp: '172\.19\.0\.\d+'
        replace: "{{ pg_ip.stdout }}"
      loop: "{{ fichiers_python.files }}"
      ignore_errors: yes

    - name: "5. Chercher tous les docker-compose.yml"
      find:
        paths: /opt
        patterns: "docker-compose.yml"
        recurse: yes
        depth: 2
      register: compose_files

    - name: "6. Restart tous les conteneurs"
      tags: [docker, restart, reboot]
      command: docker compose -f {{ item.path }} restart
      loop: "{{ compose_files.files }}"
      ignore_errors: yes

    - name: "7. Résumé"
      debug:
        msg: |
          IP PostgreSQL : {{ pg_ip.stdout }}
          Fichiers Python corrigés : {{ fichiers_python.files | length }}
          Projets redémarrés : {{ compose_files.files | length }}

    - name: "8. Connecter jobassistant-backend au réseau n8n"
      tags: [jobassistant, network, reboot]
      shell: docker network connect debian_default jobassistant-backend 2>/dev/null || true

    - name: "9. Connecter jobassistant-backend au réseau bi-stack"
      tags: [jobassistant, network, reboot]
      shell: docker network connect bi-stack_analytics-net jobassistant-backend 2>/dev/null || true

    - name: "10. Vérifier santé JobAssistant backend"
      tags: [jobassistant, health]
      shell: docker exec jobassistant-backend wget -qO- http://localhost:4003/api/health
      register: ja_health
      ignore_errors: yes

    - name: "11. Afficher statut JobAssistant"
      debug:
        msg: "JobAssistant backend: {{ ja_health.stdout | default('Non disponible') }}"
    - name: "12. Récupérer l'IP actuelle de superset-db (utilisée par JobAssistant)"
      tags: [jobassistant, postgres, ip, reboot]
      shell: docker inspect superset-db --format '{{"{{"}}(index .NetworkSettings.Networks "jobassistant_jobassistant-internal").IPAddress{{"}}"}}' 2>/dev/null || docker inspect superset-db --format '{{"{{"}}range .NetworkSettings.Networks{{"}}"}}{{"{{"}}.IPAddress{{"}}"}} {{"{{"}}end{{"}}"}}' | awk '{print $1}'
      register: superset_db_ip
    - name: "13. Afficher l'IP superset-db trouvée"
      debug:
        msg: "IP superset-db actuelle : {{ superset_db_ip.stdout }}"
    - name: "14. Corriger l'IP superset-db dans les fichiers JS de JobAssistant"
      tags: [jobassistant, postgres, correction]
      replace:
        path: "{{ item }}"
        regexp: "host: '172\\.\\d+\\.\\d+\\.\\d+'"
        replace: "host: '{{ superset_db_ip.stdout | trim }}'"
      loop:
        - /opt/jobassistant/backend/server.js
        - /opt/jobassistant/backend/collector.js
        - /opt/jobassistant/backend/collector_ft_massive.js
        - /opt/jobassistant/backend/collector_ft_dynamic.js
        - /opt/jobassistant/backend/collector_indeed.js
      ignore_errors: yes
      register: js_fix_result
    - name: "15. Rebuild jobassistant-backend si correction appliquee"
      tags: [jobassistant, docker, restart]
      shell: cd /opt/jobassistant && docker compose up -d --build jobassistant-backend
      when: js_fix_result.changed
      ignore_errors: yes
    - name: "16. Verifier sante JobAssistant apres correction superset-db"
      tags: [jobassistant, health]
      shell: sleep 10 && docker exec jobassistant-backend wget -qO- http://localhost:4003/api/jobs?limit=5 2>/dev/null | head -c 200
      register: ja_jobs_check
      ignore_errors: yes
    - name: "17. Resume final superset-db"
      debug:
        msg: |
          IP superset-db utilisee : {{ superset_db_ip.stdout }}
          Test endpoint /api/jobs : {{ ja_jobs_check.stdout | default('Echec') }}
