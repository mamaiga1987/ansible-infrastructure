---
- name: Sauvegarde automatique GitHub
  hosts: local
  become: no

  tasks:
    - name: "1. Corriger les permissions"
      file:
        path: "{{ item }}"
        owner: debian
        group: debian
        recurse: yes
      become: yes
      loop:
        - /opt/ansible/rapports
        - /opt/ansible/configs
        - /opt/ansible/logs
      ignore_errors: yes

    - name: "2. Git add tous les fichiers"
      command: git -C /opt/ansible add .
      ignore_errors: yes

    - name: "3. Git commit avec date"
      command: >
        git -C /opt/ansible commit -m
        "Auto: Sauvegarde infrastructure {{ ansible_date_time.date }} {{ ansible_date_time.time }}"
      register: commit_result
      ignore_errors: yes

    - name: "4. Git push"
      command: git -C /opt/ansible push origin main
      register: push_result
      ignore_errors: yes

    - name: "5. Résumé"
      debug:
        msg: |
          {{ '✅ GitHub mis à jour' if not push_result.failed else '⚠️ Push échoué' }}
          {{ commit_result.stdout | default('Rien à committer') }}

    - name: Git push JobAssistant IA
      shell: cd /opt/jobassistant && git add -A && git commit -m 'Auto backup 2026-06-16' && git push origin main || true
      ignore_errors: yes
